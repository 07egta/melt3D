name: MeltCAD PR validation

on:
  pull_request:
    branches:
      - main
      - easy-layout-and-melt
      - integration/yuracad-20261017
    paths:
      - 'apps/meltcad/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/meltcad-pr-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meltcad-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: MeltCAD tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux graphics dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev mesa-vulkan-drivers
      - name: Test MeltCAD
        run: cargo test --profile ci --locked -p meltcad
      - name: Build Windows app
        if: runner.os == 'Windows'
        run: cargo build --release --locked -p meltcad
