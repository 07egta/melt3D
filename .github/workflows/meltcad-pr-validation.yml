name: MeltCAD PR validation

on:
  pull_request:
    branches: [main, easy-layout-and-melt, integration/yuracad-20261017]

permissions:
  contents: read

concurrency:
  group: meltcad-pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  meltcad:
    name: MELTCAD tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev mesa-vulkan-drivers
      - name: Run MELTCAD tests
        run: cargo test --profile ci --locked -p meltcad
      - name: Build Windows release executable
        if: runner.os == 'Windows'
        run: cargo build --release --locked -p meltcad
