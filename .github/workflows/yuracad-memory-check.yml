name: YuraCAD memory and size candidate

# Check experimental changes in a PR. NEVER publish or replace Release assets here.
on:
  pull_request:
    branches: [easy-layout-and-melt]
    paths:
      - "apps/meltcad/**"
      - "Cargo.toml"
      - "scripts/yuracad-windows-footprint.ps1"
      - ".github/workflows/yuracad-memory-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-check:
    name: Tests and Windows Release (no publish)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Unit and regression tests
        run: cargo test --profile ci -p meltcad --locked
      - name: Production-configuration Release build
        run: cargo build --release -p meltcad --locked
      - name: Experimental no-debuginfo profile build
        run: cargo build --profile yuracad-small -p meltcad --locked
      - name: Record EXE sizes (not a baseline performance comparison)
        shell: pwsh
        run: |
          $release = (Get-Item target/release/meltcad.exe).Length
          $trial = (Get-Item target/yuracad-small/meltcad.exe).Length
          "release_bytes=$release" | Tee-Object -FilePath yuracad-size.txt
          "trial_strip_debuginfo_bytes=$trial" | Tee-Object -FilePath yuracad-size.txt -Append
          if ($release -le 0 -or $trial -le 0) { throw "Missing Windows executable" }
      - name: Upload files for local A/B measurement (no Release publishing)
        uses: actions/upload-artifact@v4
        with:
          name: yuracad-memory-size-candidate
          path: |
            target/release/meltcad.exe
            target/yuracad-small/meltcad.exe
            yuracad-size.txt
