name: YuraCAD UI Windows verification

on:
  pull_request:
    branches: [easy-layout-and-melt]
    paths:
      - 'apps/meltcad/**'
      - 'scripts/test-yuracad-windows-ui.ps1'
      - '.github/workflows/yuracad-ui-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-ui:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compile and run MeltCAD regression tests
        run: cargo test --locked -p meltcad
      - name: Build YuraCAD for Windows
        run: cargo build --locked -p meltcad
      - name: Capture GUI at desktop, medium and small window sizes
        shell: pwsh
        continue-on-error: true
        run: ./scripts/test-yuracad-windows-ui.ps1
      - name: Preserve native Windows display evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yuracad-ui-windows-snapshots
          path: ui-snapshots/*.ppm
          if-no-files-found: warn
