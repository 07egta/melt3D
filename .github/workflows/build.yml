name: Build

# Windows app (.exe), the web app, and the main tests. Run by hand from the Actions tab
# ("Run workflow"), on pushes to main / easy-layout-and-melt, or on PRs into the working
# branch. Development checks never publish a release. A manual run can prepare a
# new draft for a separately authorized, verified release.
on:
  push:
    branches: [main, easy-layout-and-melt]
  pull_request:
    branches: [easy-layout-and-melt]
  workflow_dispatch:
    inputs:
      prepare_draft:
        description: Prepare a new Windows draft after all checks (does not publish)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  # Pull-request runs may be cancelled. Never interrupt draft preparation.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: v0.21.14

jobs:
  windows:
    name: Windows app
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build both Windows executables
        run: cargo build --release --locked -p meltcad -p solidcraft
      # These tests exercise scene creation, saving, and mesh export on a Windows runner.
      # This is NOT an interactive Windows GUI acceptance test.
      - name: Run MELTCAD regression tests on Windows
        run: cargo test --release --locked -p meltcad
      - name: Exercise the Windows EXE (headless scene open and PNG render)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'yuracad-headless'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          # Same backward-compatible scene format covered by model.rs tests.
          $fixture = '{"groups":[{"name":"smoke","op":"Add","blend":0,"visible":true,"shapes":[{"name":"sphere","kind":"Sphere","size":[20,1,1],"round":0,"pos":[0,0,20],"rot":[0,0,0],"scale":[1,1,1],"op":"Add","blend":6,"material":{"color":[1,0,0],"roughness":0.3,"metallic":1},"visible":true,"outline":[]}]}]}'
          $scene = Join-Path $dir 'scene.yura'
          $png = Join-Path $dir 'render.png'
          [System.IO.File]::WriteAllText($scene, $fixture)
          $exe = (Resolve-Path 'target/release/meltcad.exe').Path
          $args = "--render `"$scene`" `"$png`" 96"
          $process = Start-Process -FilePath $exe -ArgumentList $args -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "YURACAD.exe headless run exited $($process.ExitCode)" }
          if (-not (Test-Path $png -PathType Leaf)) { throw 'Windows EXE did not write a PNG' }
          $pngData = [System.IO.File]::ReadAllBytes($png)
          if ($pngData.Length -lt 1000 -or $pngData[0] -ne 137 -or $pngData[1] -ne 80 -or $pngData[2] -ne 78 -or $pngData[3] -ne 71) {
            throw 'Windows EXE PNG output is invalid'
          }
      - name: Verify both binaries exist and are distinct
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $melt = Get-Item 'target/release/meltcad.exe' -ErrorAction Stop
          $classic = Get-Item 'target/release/solidcraft.exe' -ErrorAction Stop
          if ($melt.Length -lt 1MB -or $classic.Length -lt 1MB) { throw 'A Windows EXE is unexpectedly small' }
          if ((Get-FileHash $melt.FullName).Hash -eq (Get-FileHash $classic.FullName).Hash) {
            throw 'MELTCAD and Classic executables must be different binaries'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: meltcad-windows
          if-no-files-found: error
          retention-days: 7
          path: |
            target/release/meltcad.exe
            target/release/solidcraft.exe

  web:
    name: Web app
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install trunk
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build the web app
        working-directory: apps/solidcraft-web
        run: trunk build --release --public-url ./
      - uses: actions/upload-artifact@v4
        with:
          name: solidcraft-web
          path: dist/web

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev mesa-vulkan-drivers
      - name: Tests
        shell: bash
        run: |
          set +e
          cargo test --profile ci --locked -p solidcraft-geom -p solidcraft-doc -p solidcraft-ui-egui --lib 2>&1 | tee test1.log
          s1=${PIPESTATUS[0]}
          cargo test --profile ci --locked -p solidcraft-engine --lib -- --skip robustness --skip hostile_params 2>&1 | tee test2.log
          s2=${PIPESTATUS[0]}
          cargo test --profile ci --locked -p meltcad 2>&1 | tee test3.log
          s3=${PIPESTATUS[0]}
          # Show what failed as annotations, so the result can be read without the full log.
          grep -hE "^test .* FAILED|panicked at|^error(\[|:)" test1.log test2.log test3.log | head -30 | while read -r line; do echo "::error::$line"; done
          grep -hE "test result" test1.log test2.log test3.log | while read -r line; do echo "::notice::$line"; done
          exit $((s1 + s2 + s3))

  # Preparing a release is an explicit action; merging a PR never replaces the
  # current download. Every attempt uses a new draft, so a partial upload cannot
  # expose a mixed set of executables or overwrite a previously published asset.
  prepare_draft:
    name: Prepare verified Windows draft
    if: github.event_name == 'workflow_dispatch' && inputs.prepare_draft && github.ref_name == 'easy-layout-and-melt'
    needs: [windows, tests, web]
    runs-on: ubuntu-latest
    concurrency:
      group: melt3d-windows-draft
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Download executables from this successful run only
        uses: actions/download-artifact@v4
        with:
          name: meltcad-windows
          path: dist
      - name: Validate binaries and prepare checksums
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          from hashlib import sha256
          import shutil
          pairs = [
              (Path("dist/meltcad.exe"), Path("YURACAD.exe")),
              (Path("dist/solidcraft.exe"), Path("YURACAD-Classic.exe")),
          ]
          sums = []
          for source, output in pairs:
              if source.stat().st_size < 1024 * 1024:
                  raise SystemExit(f"Unexpectedly small Windows executable: {source}")
              with source.open("rb") as stream:
                  if stream.read(2) != b"MZ":
                      raise SystemExit(f"Not a Windows executable: {source}")
              shutil.copyfile(source, output)
              sums.append((sha256(output.read_bytes()).hexdigest(), output.name))
          if sums[0][0] == sums[1][0]:
              raise SystemExit("The modeller and Classic must be different executables")
          Path("SHA256SUMS.txt").write_text("".join(f"{digest}  {name}\n" for digest, name in sums))
          PYCODE
          cat > release-notes.txt <<EOF
          Source commit: ${GITHUB_SHA}
          Successful build: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          This is an unpublished Windows candidate. CI checks native Rust tests and
          a headless EXE render. Interactive launch, New, Save/Reopen and Export
          still require the real-Windows acceptance checks in
          docs/yuracad-windows-acceptance.md before publication is authorized.

          Asset names preserve the existing download naming. SHA256SUMS.txt covers
          both executables from this one workflow run. Existing releases are unchanged.
          EOF
      - name: Create a new unpublished draft for the current checked commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch_head="$(gh api "repos/${GITHUB_REPOSITORY}/branches/easy-layout-and-melt" --jq .commit.sha)"
          if [ "$branch_head" != "$GITHUB_SHA" ]; then
            echo "::notice::Superseded run: branch moved to $branch_head; no draft created."
            exit 0
          fi
          tag="melt3d-candidate-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" YURACAD.exe YURACAD-Classic.exe SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease \
            --title "Melt3D Windows candidate ${GITHUB_SHA:0:12}" --notes-file release-notes.txt
