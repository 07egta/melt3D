name: Build

# Windows app (.exe), the web app, and the main tests. Run by hand from the Actions tab
# ("Run workflow"), on pushes to main / easy-layout-and-melt, or on PRs into the working
# branch. Upstream release, store and Pages workflows are parked to save Actions minutes.
on:
  push:
    branches: [main, easy-layout-and-melt]
  pull_request:
    branches: [easy-layout-and-melt]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: v0.21.14

jobs:
  windows:
    name: Windows app
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p meltcad --locked
      - run: cargo build --release -p solidcraft --locked
      - uses: actions/upload-artifact@v4
        with:
          name: meltcad-windows
          path: |
            target/release/meltcad.exe
            target/release/solidcraft.exe

  web:
    name: Web app
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install trunk
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build the web app
        working-directory: apps/solidcraft-web
        run: trunk build --release --public-url ./
      - uses: actions/upload-artifact@v4
        with:
          name: solidcraft-web
          path: dist/web

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev mesa-vulkan-drivers
      - name: Tests
        shell: bash
        run: |
          set +e
          cargo test --profile ci --locked -p solidcraft-geom -p solidcraft-doc -p solidcraft-ui-egui --lib 2>&1 | tee test1.log
          s1=${PIPESTATUS[0]}
          cargo test --profile ci --locked -p solidcraft-engine --lib -- --skip robustness --skip hostile_params 2>&1 | tee test2.log
          s2=${PIPESTATUS[0]}
          cargo test --profile ci --locked -p meltcad 2>&1 | tee test3.log
          s3=${PIPESTATUS[0]}
          # Show what failed as annotations, so the result can be read without the full log.
          grep -hE "^test .* FAILED|panicked at|^error(\[|:)" test1.log test2.log test3.log | head -30 | while read -r line; do echo "::error::$line"; done
          grep -hE "test result" test1.log test2.log test3.log | while read -r line; do echo "::notice::$line"; done
          exit $((s1 + s2 + s3))

  # Never replace the download with a build that failed tests, and never publish
  # from a pull request or a branch other than the YURACAD working branch.
  publish:
    name: Publish tested YURACAD Windows release
    if: github.event_name == 'push' && github.ref_name == 'easy-layout-and-melt'
    needs: [windows, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows executables from this run
        uses: actions/download-artifact@v4
        with:
          name: meltcad-windows
          path: dist
      - name: Replace rolling YURACAD release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s dist/meltcad.exe
          test -s dist/solidcraft.exe
          cp dist/meltcad.exe YURACAD.exe
          cp dist/solidcraft.exe YURACAD-Classic.exe
          gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create latest --repo "$GITHUB_REPOSITORY" --prerelease --title "Latest build" --notes "Newest Windows builds: YURACAD.exe (blob modeller) and YURACAD-Classic.exe (CAD)"
          gh release upload latest YURACAD.exe YURACAD-Classic.exe --repo "$GITHUB_REPOSITORY" --clobber
