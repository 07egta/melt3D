[package]
name = "meltcad"
description = "YURACAD: a light Womp3D-style blob modeller"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "meltcad"

[lints]
workspace = true

[dependencies]
eframe = { workspace = true, features = ["default_fonts", "wgpu", "wayland", "x11"] }
egui = { workspace = true }
egui-wgpu = { workspace = true }
wgpu = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rfd = { workspace = true }
pollster = { workspace = true }
log = { workspace = true }
solidcraft-geom = { workspace = true }
ttf-parser = { workspace = true }

[dev-dependencies]
naga = { version = "30.0.1", features = ["wgsl-in", "hlsl-out", "spv-out", "msl-out", "glsl-out"] }
